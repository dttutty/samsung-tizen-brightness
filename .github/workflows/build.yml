name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: >-
          dotnet publish .\src\SamsungTizenBrightness\SamsungTizenBrightness.csproj
          -c Release
          -r win-x64
          --self-contained false
          -o .\publish
      - name: Protocol tests (no display required)
        run: dotnet run --project .\tests\SamsungTizenBrightness.Tests -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: Samsung-Tizen-Brightness-win-x64
          path: .\publish\Samsung Tizen 亮度.exe
